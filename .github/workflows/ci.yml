name: Pruebas

# Se ejecuta en cada envío a main y en cada pull request. main es la rama que
# se publica en producción automáticamente, así que un fallo aquí es lo único
# que avisa antes de que el cliente lo vea.
on:
  # Cualquier rama, no solo main: main se publica en producción en cuanto se
  # envía, así que esperar a main para enterarse de un fallo llega tarde.
  push:
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sirgdi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress

      # Esto también comprueba que el proyecto se puede instalar desde cero.
      # El seed llevaba desde junio insertando una columna renombrada, así que
      # una instalación limpia fallaba y nadie se había dado cuenta.
      - name: Cargar esquema y datos semilla
        run: |
          mysql -h 127.0.0.1 -u root -proot sirgdi < sql/schema.sql
          mysql -h 127.0.0.1 -u root -proot sirgdi < sql/seeds.sql

      - name: Análisis estático
        # Se invoca con php y no directamente: vendor/ está versionado y el
        # bit de ejecución no sobrevive a un commit hecho desde Windows, así
        # que llamar al binario a secas falla con "exit code 126".
        run: php vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M

      - name: Pruebas
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sirgdi
          DB_USER: root
          DB_PASS: root
          # Secretos de usar y tirar: el arranque falla a propósito si faltan
          # o no tienen el formato correcto. ENCRYPTION_KEY son 64 caracteres
          # hexadecimales porque el cifrado la pasa por hex2bin y exige 32 bytes.
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_SECRET: 0123456789abcdef0123456789abcdef
          CSRF_SALT: 0123456789abcdef
          ENV: development
        run: php vendor/bin/phpunit --no-coverage --log-junit junit.xml

      # Sin esto, un fallo de pruebas solo deja "exit code 2" y hay que abrir el
      # log completo para saber que se rompió. Aquí salen los nombres y los
      # mensajes como anotaciones, visibles en el propio pull request.
      - name: Detallar las pruebas que fallaron
        if: failure()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys, os
          if not os.path.exists('junit.xml'):
              print('::error::No se generó junit.xml'); sys.exit(0)
          for caso in ET.parse('junit.xml').getroot().iter('testcase'):
              for mal in list(caso.findall('failure')) + list(caso.findall('error')):
                  texto = ' | '.join((mal.get('message') or (mal.text or '')).split(chr(10)))[:600]
                  print('::error title=%s::%s' % (caso.get('name'), texto))
          EOF
